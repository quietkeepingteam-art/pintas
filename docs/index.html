<!DOCTYPE html>
<html lang="ilo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pintas Playground</title>
<style>
  :root { color-scheme: light; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; background: #f3f4f6;
  }
  header {
    display: flex; flex-wrap: wrap; gap: 0.6rem; align-items: center;
    padding: 0.6rem 0.8rem; background: #1f2937; color: #fff;
  }
  header h1 { font-size: 0.95rem; margin: 0 0.4rem 0 0; font-weight: 600; }

  .toolbar { background: #111827; border-top: 1px solid #374151; }
  .toolbar[hidden], #more-panel[hidden] { display: none; }
  .tb-main { display: flex; flex-wrap: wrap; gap: 0.35rem 0.5rem; align-items: center;
    padding: 0.4rem 0.8rem; }
  #more-panel { display: flex; flex-wrap: wrap; gap: 0.5rem 0.9rem; padding: 0.5rem 0.8rem 0.6rem;
    border-top: 1px solid #374151; max-height: 40vh; overflow-y: auto; background: #0f172a; }
  .sec { display: flex; flex-direction: column; gap: 0.15rem; padding-right: 0.9rem;
    border-right: 1px solid #1f2937; }
  .sec:last-child { border-right: none; }
  .sec-name { font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.08em;
    color: #9ca3af; padding-left: 0.3rem; }
  .sec .row { display: flex; flex-wrap: wrap; gap: 0.15rem; align-items: center; min-height: 1.6rem; }
  .collapse-btn, .more-btn { display: inline-flex; align-items: center; gap: 0.35rem;
    background: transparent; color: #d1d5db; border: 1px solid #4b5563; border-radius: 999px;
    padding: 0.25rem 0.75rem; font: inherit; font-size: 0.78rem; cursor: pointer; }
  .collapse-btn:hover, .more-btn:hover { background: #374151; }
  .collapse-btn:focus-visible, .more-btn:focus-visible { outline: 2px solid #60a5fa; outline-offset: 1px; }
  .collapse-btn .ico, .more-btn .ico { width: 14px; height: 14px; transition: transform 0.15s; }
  .collapse-btn[aria-expanded="false"] .ico { transform: rotate(-90deg); }
  .more-btn[aria-expanded="true"] .ico { transform: rotate(180deg); }
  .more-btn { margin-left: 0.2rem; }
  .group { display: flex; gap: 0.15rem; padding: 0 0.5rem 0 0;
    border-right: 1px solid #374151; align-items: center; }
  .group:last-child { border-right: none; }
  button.tb { display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    gap: 0.2rem; width: 4.5rem; min-height: 3.1rem; padding: 0.35rem 0.1rem 0.25rem;
    background: transparent; color: #e5e7eb; border: 1px solid transparent; border-radius: 8px;
    font: inherit; cursor: pointer; }
  button.tb:hover { background: #374151; border-color: #4b5563; }
  button.tb:active { transform: translateY(1px); }
  button.tb:focus-visible { outline: 2px solid #60a5fa; outline-offset: 1px; }
  button.tb .ico { flex: none; color: #93c5fd; }
  button.tb .lbl { font-size: 0.62rem; line-height: 1.1; text-align: center; color: #d1d5db;
    max-width: 100%; overflow-wrap: break-word; }
  button.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid #fff;
    cursor: pointer; padding: 0; margin: 0 0.1rem; }
  #save-btn { flex-direction: row; gap: 0.4rem; width: auto; min-height: 0; margin-left: 0.4rem;
    padding: 0.4rem 0.8rem; background: #2563eb; border-color: #2563eb; }
  #save-btn .ico { color: #fff; width: 18px; height: 18px; }
  #save-btn .lbl { font-size: 0.85rem; font-weight: 600; color: #fff; }
  #save-btn:hover { background: #1d4ed8; }
  button.hdr { flex-direction: row; gap: 0.35rem; width: auto; min-height: 0;
    padding: 0.35rem 0.65rem; border-color: #4b5563; }
  button.hdr .ico { width: 18px; height: 18px; color: #e5e7eb; }
  button.hdr .lbl { font-size: 0.8rem; color: #e5e7eb; }
  button.hdr:disabled { opacity: 0.35; cursor: default; }
  button.hdr:disabled:hover { background: transparent; border-color: #4b5563; }
  #undo-btn { margin-left: auto; }
  @media (max-width: 900px) {
    .tb-main { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .group, .more-btn { flex: none; }
  }

  #save-status { font-size: 0.8rem; color: #a7f3d0; min-width: 6rem; }
  main { flex: 1; display: flex; min-height: 0; }
  #editor-wrap { position: relative; flex: 1 1 50%; min-width: 0; background: #fff;
    border-right: 1px solid #d1d5db; }
  #preview-pane { flex: 1 1 50%; min-width: 0; }
  /* The textarea and the highlight <pre> must share identical metrics so the
     coloured text sits exactly under the (transparent) typed text. */
  #editor, #hl {
    position: absolute; inset: 0; margin: 0; border: none; padding: 1rem;
    font-size: 0.9rem; line-height: 1.5; tab-size: 4;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
    white-space: pre-wrap; overflow-wrap: break-word; word-break: normal;
    overflow-x: hidden; overflow-y: scroll; letter-spacing: 0;
  }
  #editor { resize: none; background: transparent; color: transparent;
    caret-color: #111827; outline: none; z-index: 1; }
  #editor::selection { background: rgba(37, 99, 235, 0.25); color: transparent; }
  #hl { z-index: 0; pointer-events: none; color: #111827; background: #fff;
    scrollbar-color: transparent transparent; }
  #hl::-webkit-scrollbar { background: transparent; }
  #hl::-webkit-scrollbar-thumb { background: transparent; }
  #hl code { font: inherit; }
  .t-cmd { color: #1d4ed8; font-weight: 600; }
  .t-block, .t-end { color: #7c3aed; font-weight: 600; }
  .t-ctrl { color: #c2410c; font-weight: 600; }
  .t-str { color: #15803d; }
  .t-var { color: #b45309; background: #fef3c7; border-radius: 3px; }
  .t-num { color: #0e7490; }
  .t-op { color: #be185d; }
  .t-kw { color: #c2410c; }
  .t-com { color: #6b7280; font-style: italic; }
  .t-prop { color: #0369a1; }
  .t-css { color: #374151; }
  .t-err { color: #b91c1c; text-decoration: underline wavy #ef4444; }
  #preview-pane { display: flex; flex-direction: column; }
  #error-box {
    display: none; background: #fef2f2; color: #991b1b; padding: 0.6rem 1rem;
    font-size: 0.85rem; border-bottom: 1px solid #fecaca; white-space: pre-wrap;
  }
  #preview { flex: 1; border: none; background: #fff; }
</style>
</head>

<script>
(function () {
  var status = document.getElementById("save-status");
  var realFetch = window.fetch.bind(window);
  var FILES = ["pintas.py", "pintas_editor.py", "theme_generator.py", "pattern_generator.py", "editor_toolbar.py"];
  var PY_API = [
    "import json, sys",
    "sys.path.insert(0, '/pintas')",
    "import pintas, pintas_editor",
    "def api(path, payload_json):",
    "    p = json.loads(payload_json)",
    "    try:",
    "        if path == '/compile':",
    "            html, _ = pintas.compile_pintas(p.get('source', ''), live_reload=False)",
    "            return json.dumps({'ok': True, 'html': html})",
    "        if path == '/generate-theme':",
    "            snippet, accent, bg = pintas_editor.generate_theme_snippet(p.get('seed'))",
    "            return json.dumps({'ok': True, 'snippet': snippet, 'accent': accent, 'bg': bg})",
    "        if path == '/generate-pattern':",
    "            snippet = pintas_editor.generate_pattern_snippet(p.get('seed'), p.get('size', 6),",
    "                p.get('accent', '#2563eb'), p.get('bg', '#f0f6ff'), p.get('target', 'body'))",
    "            return json.dumps({'ok': True, 'snippet': snippet})",
    "        return json.dumps({'ok': False, 'error': 'Unknown endpoint ' + path})",
    "    except Exception as e:",
    "        return json.dumps({'ok': False, 'error': str(e) or type(e).__name__})"
  ].join("\n");

  var ready = (async function () {
    status.textContent = "Agkarga ti Python...";
    var py = await loadPyodide();
    py.FS.mkdirTree("/pintas");
    for (var i = 0; i < FILES.length; i++) {
      var res = await realFetch("py/" + FILES[i]);
      if (!res.ok) throw new Error("Saan a naikarga ti " + FILES[i]);
      py.FS.writeFile("/pintas/" + FILES[i], await res.text());
    }
    py.runPython(PY_API);
    status.textContent = "";
    return py.globals.get("api");
  })();
  ready.catch(function (e) { status.textContent = "Diak nakarga ti Python: " + e.message; });

  function reply(obj) {
    return { ok: true, json: function () { return Promise.resolve(obj); } };
  }

  window.fetch = function (url, opts) {
    var path = String(url);
    if (path === "/save") {           // no server file: download it instead
      var src = JSON.parse(opts.body).source;
      var a = document.createElement("a");
      a.href = URL.createObjectURL(new Blob([src], { type: "text/plain;charset=utf-8" }));
      a.download = "panid.pintas";
      document.body.appendChild(a); a.click(); a.remove();
      return Promise.resolve(reply({ ok: true }));
    }
    if (path.charAt(0) !== "/") return realFetch(url, opts);
    return ready.then(function (api) {
      return reply(JSON.parse(api(path, opts.body)));
    });
  };
})();
</script>
<script type="application/json" id="initial-source">"# Pintas 0.6 \u2014 full landing-page example\npanid \"Pintas Demo\"\nulo \"Pintas - Napintas a Webpage\"\ntema \"asul\"\n\ndalan\nsilpo \"Umuna\" \"#umuna\"\nsilpo \"Features\" \"#features\"\nsilpo \"Pricing\" \"#pricing\"\nsilpo \"Kontak\" \"#kontak\"\nmurdong\n\nimmuna\ntexto \"Kablaaw!\"\nsubtexto \"Aramiden ti napintas a webpage babaen iti Ilokano.\"\nayab \"Contact Us\" \"mailto:hello@example.com\"\nayab \"Learn More\" \"#features\"\nmurdong\n\ngarrapon\npagtudo \"FEATURES\"\ntexto \"Simple, powerful, Pintas.\"\nbutangan \"Add structured sections without writing HTML or CSS.\"\n\nduakolum\ngarrapon\npagimbagan \"Napardas\" \"Simple commands compile into clean HTML.\"\nmurdong\ngarrapon\npagimbagan \"Napintas\" \"Themes and responsive cards make pages look polished.\"\nmurdong\nmurdong\nmurdong\n\npila\n\ntengnga\ntexto \"Pricing\"\nlistaan\nringgor \"Plano\" \"Presyo\" \"Kasapulan\"\nringgor \"Basic\" \"Libre\" \"Umuna a proyekto\"\nringgor \"Pro\" \"\u20b1499\" \"Ad-adu a features\"\nringgor \"Business\" \"\u20b1999\" \"Para kadagiti team\"\npila\n\ngarrapon\ntexto \"Ready to build?\"\nbutangan \"Start creating your own Pintas webpage today.\"\nayab \"Email Us\" \"mailto:hello@example.com\"\nayab \"Call Us\" \"tel:+639000000000\"\nmurdong\n\ntexto \"More UI\"\nsaludsod \"Ania ti Pintas?\" \"Ti Pintas ket maysa a simple a Ilokano-inspired language para iti webpages.\"\nsaludsod \"Mabalin kadi iti countdown?\" \"Wen. Ipaay laeng ti ISO 8601 a target date.\"\npagbilangan \"2026-12-31T23:59:59\" \"Launching soon\"\npagsuratan \"Naganmo\" \"Isurat ditoy ti nagan mo\"\n\nladawanan\nladawan \"https://picsum.photos/seed/pintas1/600/450\"\nladawan \"https://picsum.photos/seed/pintas2/600/450\"\nladawan \"https://picsum.photos/seed/pintas3/600/450\"\nmurdong\n\nudi\nbutangan \"Naaramid babaen ti Pintas\"\nmurdong\n"</script>
<script>
(function () {
  var THEMES = [
    ["puraw", "#2563eb"], ["nangisit", "#3b82f6"], ["asul", "#2563eb"],
    ["berde", "#16a34a"], ["duyaw", "#d97706"], ["labaga", "#dc2626"],
    ["rabii", "#e838ff"], ["balitok", "#d4af37"], ["danum", "#0891b2"]
  ];
  var themeGroup = document.getElementById("theme-group");
  THEMES.forEach(function (pair) {
    var b = document.createElement("button");
    b.className = "swatch";
    b.style.background = pair[1];
    b.title = pair[0];
    b.dataset.kind = "line";
    b.dataset.line = 'tema "' + pair[0] + '"';
    themeGroup.appendChild(b);
  });

  var editor = document.getElementById("editor");
  var preview = document.getElementById("preview");
  var errorBox = document.getElementById("error-box");
  var saveBtn = document.getElementById("save-btn");
  var saveStatus = document.getElementById("save-status");

  function insertAtCursor(text) {
    var start = editor.selectionStart;
    var end = editor.selectionEnd;
    editor.value = editor.value.slice(0, start) + text + editor.value.slice(end);
    return start;
  }

  function insertSnippet(prefix, placeholder, suffix) {
    var insertStart = insertAtCursor(prefix + placeholder + suffix + "\n");
    var selStart = insertStart + prefix.length;
    var selEnd = selStart + placeholder.length;
    editor.focus();
    editor.setSelectionRange(selStart, selEnd);
    commit();
  }

  function insertBlock(openLine, closeLine, body, select) {
    body = body || "";
    var snippet = openLine + "\n" + body + "\n" + closeLine + "\n";
    var insertStart = insertAtCursor(snippet);
    var at = select ? openLine.indexOf(select) : -1;
    editor.focus();
    if (at >= 0) {
      editor.setSelectionRange(insertStart + at, insertStart + at + select.length);
    } else {
      var caret = insertStart + openLine.length + 1;
      editor.setSelectionRange(caret, caret);
    }
    commit();
  }

  function insertLine(text) {
    var insertStart = insertAtCursor(text + "\n");
    var caret = insertStart + text.length + 1;
    editor.focus();
    editor.setSelectionRange(caret, caret);
    commit();
  }

  var toggleCounter = 1;
  function insertToggle() {
    var name = "detalye" + toggleCounter++;
    var before = 'pagpindutan "Ipakita/Ilemmeng" "' + name + '"\n\n'
      + 'garrapon "' + name + '"\n';
    var after = "\nmurdong\n";
    var insertStart = insertAtCursor(before + after);
    var caret = insertStart + before.length;
    editor.focus();
    editor.setSelectionRange(caret, caret);
    commit();
  }
  document.getElementById("toggle-btn").addEventListener("click", insertToggle);

  document.querySelectorAll('button[data-kind="snippet"]').forEach(function (btn) {
    btn.addEventListener("click", function () {
      insertSnippet(btn.dataset.prefix, btn.dataset.placeholder, btn.dataset.suffix);
    });
  });
  document.querySelectorAll('button[data-kind="block"]').forEach(function (btn) {
    btn.addEventListener("click", function () {
      insertBlock(btn.dataset.open, btn.dataset.close, btn.dataset.body, btn.dataset.select);
    });
  });
  document.querySelectorAll('button[data-kind="line"]').forEach(function (btn) {
    btn.addEventListener("click", function () {
      insertLine(btn.dataset.line);
    });
  });

  // Generators: each click asks the server for a fresh, verified result and
  // REPLACES the previous generated block (marked by "# >>> name" ...
  // "# <<< name" comment lines) instead of stacking copies.
  var lastColors = { accent: "#2563eb", bg: "#f0f6ff" };

  function placeGenerated(name, snippet) {
    var re = new RegExp("# >>> " + name + "\n[\\s\\S]*?# <<< " + name + "\n?");
    if (re.test(editor.value)) {
      editor.value = editor.value.replace(re, function () { return snippet + "\n"; });
      editor.focus();
      commit();
    } else {
      insertLine(snippet);
    }
  }

  function generate(url, body, name, done) {
    body.seed = Math.floor(Math.random() * 1000000);
    fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (!data.ok) {
          errorBox.textContent = data.error;
          errorBox.style.display = "block";
          return;
        }
        if (done) done(data);
        placeGenerated(name, data.snippet);
      })
      .catch(function () {
        errorBox.textContent = "Saan a maka-konekta iti server.";
        errorBox.style.display = "block";
      });
  }

  document.getElementById("gen-theme-btn").addEventListener("click", function () {
    generate("/generate-theme", {}, "tema-generator", function (data) {
      lastColors = { accent: data.accent, bg: data.bg };
    });
  });
  document.getElementById("gen-pattern-btn").addEventListener("click", function () {
    generate("/generate-pattern",
      { size: 6, accent: lastColors.accent, bg: lastColors.bg, target: "body" },
      "pattern-generator");
  });
  document.getElementById("gen-pattern-card-btn").addEventListener("click", function () {
    generate("/generate-pattern",
      { size: 4, accent: lastColors.accent, bg: lastColors.bg, target: ".garrapon" },
      "pattern-generator-lalaem");
  });

  // ---- Syntax highlighting -------------------------------------------
  var KW = {"block": ["dalan", "duakolum", "garrapon", "immuna", "ladawanan", "udi", "estilo"], "end": ["murdong"], "ctrl": ["no", "isuble"], "cmd": ["ayab", "baga", "banag", "bidyo", "bilang", "butangan", "kolor", "ladawan", "listaan", "naaramid", "pagbilangan", "pagimbagan", "pagpindutan", "pagsuratan", "pagtudo", "panid", "pila", "ringgor", "saludsod", "sao", "silpo", "subtexto", "teksto-kolor", "tema", "tengnga", "texto", "ulo"]};
  var ROLE = {};
  Object.keys(KW).forEach(function (role) {
    KW[role].forEach(function (w) { ROLE[w] = role; });
  });
  var WORD_KW = { manipud: 1, agingga: 1, addang: 1, pudno: 1, saan: 1 };
  var hl = document.getElementById("hl");
  var hlCode = hl.querySelector("code");

  function esc(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function span(cls, s) { return '<span class="t-' + cls + '">' + esc(s) + "</span>"; }

  function strHtml(s) {
    var out = "", last = 0, m, re = /\{\{[^}]*\}\}/g;
    while ((m = re.exec(s))) {
      out += esc(s.slice(last, m.index)) + span("var", m[0]);
      last = m.index + m[0].length;
    }
    return out + esc(s.slice(last));
  }

  function restHtml(rest) {
    var re = /("[^"]*"?)|(\{\{[^}]*\}\})|(-?\d+(?:\.\d+)?)|([A-Za-z_][A-Za-z0-9_-]*)|(==|!=|>=|<=|>|<)/g;
    var out = "", last = 0, m;
    while ((m = re.exec(rest))) {
      out += esc(rest.slice(last, m.index));
      if (m[1] !== undefined) {
        var closed = m[1].length > 1 && m[1].charAt(m[1].length - 1) === '"';
        out += closed ? '<span class="t-str">' + strHtml(m[1]) + "</span>" : span("err", m[1]);
      } else if (m[2] !== undefined) out += span("var", m[2]);
      else if (m[3] !== undefined) out += span("num", m[3]);
      else if (m[4] !== undefined) out += WORD_KW[m[4]] ? span("kw", m[4]) : esc(m[4]);
      else out += span("op", m[5]);
      last = m.index + m[0].length;
    }
    return out + esc(rest.slice(last));
  }

  function lineHtml(line, st) {
    var t = line.trim();
    if (st.css) {                         // inside estilo: opaque CSS
      if (t === "murdong") { st.css = false; return span("end", line); }
      var pm = /^(\s*)([A-Za-z-]+)(\s*:)(.*)$/.exec(line);
      if (pm) return esc(pm[1]) + span("prop", pm[2]) + esc(pm[3]) + span("css", pm[4]);
      return span("css", line);
    }
    if (t === "") return esc(line);
    if (t.charAt(0) === "#" || t.slice(0, 2) === "//") return span("com", line);
    var m = /^(\s*)(\S+)(.*)$/.exec(line);
    var role = Object.prototype.hasOwnProperty.call(ROLE, m[2]) ? ROLE[m[2]] : null;
    if (m[2] === "estilo") st.css = true;
    return esc(m[1]) + span(role || "err", m[2]) + restHtml(m[3]);
  }

  function highlight() {
    var st = { css: false };
    var html = editor.value.split("\n").map(function (l) { return lineHtml(l, st); }).join("\n");
    // trailing newline so the last (empty) line keeps its height in the <pre>
    hlCode.innerHTML = html + "\n";
    hl.scrollTop = editor.scrollTop;
    hl.scrollLeft = editor.scrollLeft;
  }
  editor.addEventListener("scroll", function () {
    hl.scrollTop = editor.scrollTop;
    hl.scrollLeft = editor.scrollLeft;
  });

  var debounceTimer = null;
  function scheduleCompile() {
    highlight();
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(compileNow, 400);
  }

  function compileNow() {
    fetch("/compile", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ source: editor.value })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        if (data.ok) {
          errorBox.style.display = "none";
          preview.srcdoc = data.html;
        } else {
          errorBox.textContent = data.error;
          errorBox.style.display = "block";
        }
      })
      .catch(function () {
        errorBox.textContent = "Saan a maka-konekta iti server.";
        errorBox.style.display = "block";
      });
  }

  saveBtn.addEventListener("click", function () {
    saveStatus.textContent = "Agser-serve...";
    fetch("/save", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ source: editor.value })
    })
      .then(function (res) { return res.json(); })
      .then(function (data) {
        saveStatus.textContent = data.ok ? "Naisalbar!" : ("Sayop: " + data.error);
      })
      .catch(function () {
        saveStatus.textContent = "Saan a maka-konekta iti server.";
      })
      .finally(function () {
        setTimeout(function () { saveStatus.textContent = ""; }, 2500);
      });
  });

  // ---- Undo / redo ---------------------------------------------------
  // A textarea's own undo stack is wiped whenever a script sets .value, and
  // every toolbar button and generator does. So we keep our own history.
  var undoBtn = document.getElementById("undo-btn");
  var redoBtn = document.getElementById("redo-btn");
  var hist = [], hIdx = -1, typingTop = false, lastTyped = 0, burstStart = 0, HMAX = 300;

  function updateUndoUi() {
    undoBtn.disabled = hIdx <= 0;
    redoBtn.disabled = hIdx >= hist.length - 1;
  }

  function record(kind) {
    var cur = editor.value;
    if (hIdx >= 0 && hist[hIdx] === cur) return;
    var now = Date.now();
    if (kind === "type" && typingTop && now - lastTyped < 700 && now - burstStart < 5000) {
      hist[hIdx] = cur;                    // same burst of typing = one undo step
    } else {
      hist.length = hIdx + 1;              // a new edit ends the redo branch
      hist.push(cur);
      if (hist.length > HMAX) hist.shift();
      hIdx = hist.length - 1;
      if (kind === "type") burstStart = now;
    }
    typingTop = kind === "type";
    lastTyped = now;
    updateUndoUi();
  }

  function commit() {
    record("edit");
    scheduleCompile();
  }

  function restore(target) {
    var from = editor.value, to = hist[target];
    // put the caret at the end of whatever changed
    var p = 0, max = Math.min(from.length, to.length);
    while (p < max && from.charAt(p) === to.charAt(p)) p++;
    var q = 0;
    while (q < max - p && from.charAt(from.length - 1 - q) === to.charAt(to.length - 1 - q)) q++;
    var top = editor.scrollTop;
    editor.value = to;
    editor.focus();
    editor.setSelectionRange(to.length - q, to.length - q);
    editor.scrollTop = top;
    hIdx = target;
    typingTop = false;
    updateUndoUi();
    scheduleCompile();
  }

  function undo() { if (hIdx > 0) restore(hIdx - 1); }
  function redo() { if (hIdx < hist.length - 1) restore(hIdx + 1); }

  undoBtn.addEventListener("click", undo);
  redoBtn.addEventListener("click", redo);
  editor.addEventListener("keydown", function (e) {
    if (!(e.ctrlKey || e.metaKey) || e.altKey) return;
    var k = e.key.toLowerCase();
    if (k === "z" && !e.shiftKey) { e.preventDefault(); undo(); }
    else if (k === "y" || (k === "z" && e.shiftKey)) { e.preventDefault(); redo(); }
  });
  editor.addEventListener("beforeinput", function (e) {
    if (e.inputType === "historyUndo") { e.preventDefault(); undo(); }
    else if (e.inputType === "historyRedo") { e.preventDefault(); redo(); }
  });
  editor.addEventListener("input", function () { record("type"); scheduleCompile(); });

  // ---- Collapsible toolbar; the choice is remembered ------------------
  var toolbarEl = document.getElementById("toolbar");
  var toolbarToggle = document.getElementById("toolbar-toggle");
  var moreBtn = document.getElementById("more-toggle");
  var morePanel = document.getElementById("more-panel");
  function remember(key, on) { try { localStorage.setItem(key, on ? "1" : "0"); } catch (e) {} }
  function recall(key) { try { return localStorage.getItem(key); } catch (e) { return null; } }
  function showToolbar(on) {
    toolbarEl.hidden = !on;
    toolbarToggle.setAttribute("aria-expanded", String(on));
  }
  function showMore(on) {
    morePanel.hidden = !on;
    moreBtn.setAttribute("aria-expanded", String(on));
  }
  toolbarToggle.addEventListener("click", function () {
    showToolbar(toolbarEl.hidden);
    remember("pintas.toolbar", !toolbarEl.hidden);
  });
  moreBtn.addEventListener("click", function () {
    showMore(morePanel.hidden);
    remember("pintas.more", !morePanel.hidden);
  });
  showToolbar(recall("pintas.toolbar") !== "0");
  showMore(recall("pintas.more") === "1");

  editor.value = JSON.parse(document.getElementById("initial-source").textContent);
  record("edit");
  highlight();
  compileNow();
})();
</script>
</body>
</html>
